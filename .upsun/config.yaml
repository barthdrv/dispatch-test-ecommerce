# Upsun configuration for Corner Shop (Flask + SQLite).
#
# The application directory is read-only at runtime, so the SQLite file has to
# live on a writable mount. DATABASE points at it; shop/config.py reads that.
applications:
  app:
    type: python:3.14

    # Backing space for the mount below.
    disk: 512

    mounts:
      "/data":
        source: storage
        source_path: data

    variables:
      env:
        DATABASE: /app/data/shop.sqlite
        # SECRET_KEY is deliberately not set here. Set it as a sensitive
        # project variable instead:
        #   upsun variable:create --level project --name env:SECRET_KEY \
        #     --value "$(openssl rand -hex 32)" --sensitive true

    hooks:
      build: |
        set -ex
        pip install -r requirements.txt
      deploy: |
        set -ex
        # Create and seed the catalog on first deploy only. init-db drops every
        # table, so re-running it would wipe placed orders.
        if [ ! -f "$DATABASE" ]; then
          flask --app shop:create_app init-db
        fi

    web:
      upstream:
        socket_family: unix
      commands:
        start: "gunicorn -w 4 -b unix:$SOCKET wsgi:app"

routes:
  https://{default}/:
    type: upstream
    upstream: app:http
